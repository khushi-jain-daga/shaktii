name: Bootstrap full SHAKTII project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-shaktii.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve project README
        run: cp README.md /tmp/SHAKTII-README.md

      - name: Copy original SIH26 project
        run: |
          git clone --depth 1 https://github.com/Purohitdev/SIH26.git /tmp/SIH26
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/bootstrap-shaktii.yml' /tmp/SIH26/ ./

      - name: Apply final PKAP Analyzer integration
        shell: bash
        run: |
          cat > /tmp/pkap-overlay.b64 <<'PKAP_B64'
[... ELLIPSIZATION ...]
PKAP_B64
          base64 -d /tmp/pkap-overlay.b64 > /tmp/pkap-overlay.tar.gz
          tar -xzf /tmp/pkap-overlay.tar.gz -C .
          cp /tmp/SHAKTII-README.md README.md
          rm -f pnpm-lock.yaml
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.name='shaktii'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n');"
          cat > vercel.json <<'EOF'
          {
            "framework": "vite",
            "buildCommand": "npm run build",
            "outputDirectory": "dist"
          }
          EOF

      - name: Install and production-build
        run: |
          npm install
          npm run build

      - name: Commit complete project
        run: |
          rm -f .github/workflows/bootstrap-shaktii.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add full SHAKTII + PKAP Analyzer project"
          git push origin main
