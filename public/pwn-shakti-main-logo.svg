<svg width="980" height="260" viewBox="0 0 980 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PWN SHAKTI</title>
  <desc id="desc">PWN Shakti cyber defense logo with shield, circuit traces and predictive pulse.</desc>
  <defs>
    <linearGradient id="pwnPurple" x1="40" y1="180" x2="430" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3511ff"/>
      <stop offset="0.45" stop-color="#6b20ff"/>
      <stop offset="1" stop-color="#8d35ff"/>
    </linearGradient>
    <linearGradient id="shaktiSilver" x1="445" y1="180" x2="935" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f7fb"/>
      <stop offset="0.45" stop-color="#aeb3bd"/>
      <stop offset="1" stop-color="#f7f7fb"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="355" y1="12" x2="620" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7d8de"/>
      <stop offset="0.48" stop-color="#771cff"/>
      <stop offset="1" stop-color="#4b13e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.34 0 0 0 0 0.12 0 0 0 0 1 0 0 0 0.65 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
