<svg width="980" height="360" viewBox="0 0 980 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PWN SHAKTI</title>
  <desc id="desc">Clean PWN Shakti cybersecurity logo with shield, circuit traces, pulse signal, and metallic typography.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#14101f"/>
      <stop offset="0.55" stop-color="#07080d"/>
      <stop offset="1" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="purple" x1="170" y1="150" x2="740" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8a55ff"/>
      <stop offset="0.45" stop-color="#b16cff"/>
      <stop offset="1" stop-color="#5e22ff"/>
    </linearGradient>
    <linearGradient id="silver" x1="360" y1="95" x2="595" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#a5a9b2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pwnText" x1="55" y1="278" x2="405" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cd86ff"/>
      <stop offset="0.52" stop-color="#7b2fff"/>
