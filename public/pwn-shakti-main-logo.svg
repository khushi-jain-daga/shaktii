      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.18 0 0 0 0 1 0 0 0 0.65 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="typeShadow" x="-10%" y="-25%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

