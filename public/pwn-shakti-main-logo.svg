      <circle cx="332" cy="91" r="7"/><circle cx="338" cy="123" r="7"/><circle cx="350" cy="153" r="7"/>
    </g>
    <g fill="#8c8f98" stroke="#d8d9df" stroke-width="2">
      <circle cx="389" cy="63" r="8"/><circle cx="389" cy="82" r="8"/><circle cx="396" cy="160" r="8"/>
    </g>
    <g fill="#5d19f7" opacity="0.8">
      <rect x="728" y="110" width="12" height="12" rx="3"/><rect x="744" y="110" width="12" height="12" rx="3"/><rect x="760" y="110" width="12" height="12" rx="3"/>
      <rect x="776" y="116" width="12" height="12" rx="3"/><rect x="792" y="119" width="10" height="10" rx="3"/><rect x="806" y="123" width="8" height="8" rx="2"/>
      <rect x="728" y="130" width="12" height="12" rx="3"/><rect x="744" y="130" width="12" height="12" rx="3"/><rect x="760" y="130" width="12" height="12" rx="3"/>
      <rect x="776" y="134" width="12" height="12" rx="3"/><rect x="792" y="137" width="10" height="10" rx="3"/><rect x="806" y="140" width="8" height="8" rx="2"/>
    </g>
