    <path d="M487 12C527 44 566 54 613 57V116C613 151 594 181 552 202C536 210 514 218 487 225V12Z" stroke="#651aff" stroke-width="7" opacity="0.9"/>
    <path d="M254 91H332L355 112H423L455 82" stroke="#4717ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M230 123H338L370 102H442" stroke="#551cff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M274 153H350L378 132H445" stroke="#6628ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
